# Version of the plugin.yml structure understood by the compiler.
# Change only when the manifest schema becomes incompatible.
schema_version: 1

name: ptlam-skills
description:
  A curated collection of portable agent skills for engineering, productivity,
  and utility workflows.

# Plugin release version. Build metadata after "+" does not affect SemVer
# precedence.
version: "0.1.0-alpha.2"

author:
  name: Pham Tung Lam
  email: fam.tung.lam@gmail.com
  url: https://github.com/fam-tung-lam
homepage: https://github.com/fam-tung-lam/ptlam-skills#readme
repository: https://github.com/fam-tung-lam/ptlam-skills
license: MIT
keywords:
  - agent-skills
  - engineering
  - productivity
  - utilities

marketplace:
  name: ptlam
  description:
    PTLam's portable agent skills as an installable Claude Code plugin.
  plugin_description:
    Portable agent skills for engineering, productivity, and utility workflows.
  category: development
  keywords:
    - agent-skills
    - engineering
    - productivity

categories:
  - id: engineering
    name: Engineering
    description: Skills for reviewing and delivering software changes.
  - id: productivity
    name: Productivity
    description: Skills for planning work and communicating ideas clearly.
  - id: utilities
    name: Utilities
    description: Focused helpers for small, repeatable transformations.

skills:
  - id: ptlam-git
    description:
      Plan, inspect, execute, review, diagnose, or recover Git workflows safely
      across repositories and collaboration models. Use for status and diffs;
      staging and commits; branches, worktrees, and refs; fetch, pull, merge,
      rebase, cherry-pick, revert, and history editing; pushes and deletions;
      tags; pull or merge request lifecycle work; conflicts, interrupted
      operations; recovery; and maintenance of project-local Git context and
      workflow preferences. Resolve repository policy, authority, custody,
      targets, and proof before mutation instead of assuming a topology or
      convention.
    category_id: engineering
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-testing
    description:
      Design, write, update, run, review, and diagnose automated tests at unit,
      integration, and end-to-end levels. Use when an agent needs to select a
      test level, add or repair tests, improve testability, assess test quality,
      audit test code for compliance, maintain or refresh project-local testing
      context, resolve a project's testing environment, select or
      recommend compatible test tools, or follow an explicitly requested
      test-first or Red-Green-Refactor workflow. Do not infer TDD merely from a
      request for tests or integration testing.
    category_id: engineering
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-testing-typescript
    description:
      Design, write, update, run, audit, and diagnose tests for framework-free,
      browser-free TypeScript libraries, Node.js code, CLIs, and tooling with
      Vite, Vitest, and Vitest V8 coverage. Use when such a project needs test
      implementation, Vitest configuration, coverage, mocking, Node
      environments, type tests, or stack-specific testing review. Apply
      ptlam-testing first for testing scope, level, behavior, placement, test
      doubles, TDD, and audit authority. Do not use this specialization for web
      frameworks, DOM code, or browser-runtime testing.
    category_id: engineering
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-testing
        reason: Provides the universal testing workflow and mandatory rules.
        instructions: |-
          Read and apply ptlam-testing first.
          Let it own scope, level, public seam, behavior, doubles, TDD, audit
          authority, and verification depth.
          Use this skill's source-adjacent placement instead of the foundation's
          generic test-root placement.
          Apply it only to framework-free, browser-free TypeScript, Vite, Vitest,
          and coverage mechanics left open by the foundation.
  - id: ptlam-creating-skill
    description:
      Create, review, or refactor predictable agent skills through explicit
      invocation, distinct branches, information hierarchy, completion criteria,
      context pointers, and single-source package design. Use when the user asks
      to turn a workflow or reference set into a new skill, revise an existing
      SKILL.md, or audit a skill without editing it. Resolve target-specific
      authored and generated boundaries and verify the package statically.
      Tests, evals, benchmarks, grading, comparisons, and trigger optimization
      remain outside this skill's scope.
    category_id: engineering
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-grilling
    description:
      Stress-test a plan, decision, or idea through one user-owned decision at a
      time. Use when the user explicitly asks to be grilled, challenged, or
      interviewed deeply before action, or wants to expose hidden assumptions,
      dependencies, contradictions, risks, and trade-offs. Research discoverable
      facts independently, recommend an answer for every decision, wait after
      each question, persist a resumable project-local decision record, resume
      prior grilling sessions when requested, and do not act until shared
      understanding is confirmed.
    category_id: productivity
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-creating-atomic-note
    description:
      Create, review, split, or merge atomic notes for Zettelkasten, evergreen
      notes, Obsidian, and other personal knowledge systems. Use when the user
      wants to capture an idea or source as a durable note, turn highlights or
      rough writing into self-contained notes, sharpen a vague note title,
      assess whether a note contains one independently linkable claim, split a
      broad note, or merge duplicate notes. Preserve local vault conventions,
      paraphrase source material with attribution, and annotate why links exist.
      Do not use for meeting minutes, task lists, project status notes, general
      journaling, or note-app support without knowledge-development intent.
    category_id: productivity
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-explaining-with-analogy
    description:
      Explain an unfamiliar, abstract, or complex concept through one coherent
      real-life analogy, a stable mapping table, a short story, and explicit
      caveats. Use only when the user explicitly asks for an analogy to help
      them understand or learn a concept. Do not invoke for a general request
      to explain, define, simplify, or break down a concept unless that same
      request explicitly asks for an analogy.
    category_id: productivity
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-visualization-with-html
    description:
      Create portable, polished, interactive HTML explainers and learning
      artifacts with native HTML, CSS, JavaScript, SVG, and one Material 3
      Expressive design system. Use when Codex needs to visualize architecture,
      workflows, state changes, sequences, entity relationships, semantic zoom,
      real-life analogy twins, or step-by-step system behavior in an HTML file;
      when a learner should manipulate or observe a diagram rather than read
      long prose; or when a top-to-bottom visual field guide, simulator, or
      validation artifact is requested.
    category_id: productivity
    visibility: public
    status: active
    required_skills: []
