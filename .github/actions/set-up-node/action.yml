name: Set up Node.js and install dependencies
description: Set up Node.js with npm caching and install locked dependencies.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - name: Set up Node.js runtime
      uses: ./.github/actions/set-up-node-runtime
      with:
        node-version: ${{ inputs.node-version }}
        npm-cache: "true"
    - name: Install dependencies
      shell: bash
      run: npm ci
