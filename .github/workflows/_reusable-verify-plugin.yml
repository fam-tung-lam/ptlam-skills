name: Verify plugin

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Commit or ref to verify.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify_plugin:
    name: Verify plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Set up Node.js and dependencies
        uses: ./.github/actions/set-up-node
      - name: Validate plugin input and generated artifacts
        run: npm run plugin:verify
