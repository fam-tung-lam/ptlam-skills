name: Analyze code

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Commit or ref to analyze.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  analyze_code:
    name: Analyze code
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Set up Node.js and dependencies
        uses: ./.github/actions/set-up-node
      - name: Type-check project code
        run: npm run code:typecheck
      - name: Check project code quality
        run: npm run code:check
      - name: Check Markdown quality
        run: npm run markdown:check
