name: Markdown quality

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths: &markdown_quality_paths
      - "**/*.md"
      - "**/*.mdx"
      - ".gitignore"
      - ".markdownlint-cli2.jsonc"
      - ".prettierignore"
      - ".prettierrc.json"
      - "package-lock.json"
      - "package.json"
      - ".github/workflows/markdown-quality.yml"
  push:
    branches:
      - main
    paths: *markdown_quality_paths

permissions:
  contents: read

jobs:
  markdown-quality:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Markdown
        run: npm run markdown:check
