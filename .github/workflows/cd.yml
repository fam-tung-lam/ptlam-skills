name: CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify_release_tag:
    name: Verify release tag
    if: >-
      github.ref_type == 'tag' && github.event.created && !github.event.deleted
      && !github.event.forced
    outputs:
      release_commit: ${{ steps.verify_release_tag.outputs.release_commit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node.js runtime
        uses: ./.github/actions/set-up-node-runtime
      - name: Verify release tag and commit
        id: verify_release_tag
        run:
          node --experimental-strip-types
          .github/scripts/release/release-automation-cli.ts validate-tag
          --repository-root "$GITHUB_WORKSPACE" --tag "$GITHUB_REF_NAME"
          --github-output "$GITHUB_OUTPUT"

  verify_plugin:
    name: Verify plugin
    needs: verify_release_tag
    uses: ./.github/workflows/_reusable-verify-plugin.yml

  analyze_code:
    name: Analyze code
    needs: verify_plugin
    uses: ./.github/workflows/_reusable-analyze-code.yml

  test_code:
    name: Test code and collect coverage
    needs: analyze_code
    uses: ./.github/workflows/_reusable-test-code.yml
    with:
      upload-coverage: true

  build_plugin:
    name: Build plugin
    needs: test_code
    uses: ./.github/workflows/_reusable-build-plugin.yml

  publish_release:
    name: Publish release
    needs:
      - verify_release_tag
      - test_code
      - build_plugin
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/_reusable-publish-release.yml
    with:
      tag: ${{ github.ref_name }}
      expected-commit: ${{ needs.verify_release_tag.outputs.release_commit }}
      coverage-artifact-id: ${{ needs.test_code.outputs.coverage-artifact-id }}
      plugin-artifact-id: ${{ needs.build_plugin.outputs.plugin-artifact-id }}
